{% extends 'core/base.html' %}
{% block title %}Опрос eNPS{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-4">Анонимный опрос eNPS</h2>

    {% if submitted %}
      <div class="alert alert-success">Спасибо! Ваш ответ сохранён анонимно.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">{{ form.score.label }}</label>
        {{ form.score }}
      </div>
      <div class="mb-3">
        <label class="form-label">{{ form.comment.label }}</label>
        {{ form.comment }}
      </div>
      <button type="submit" class="btn btn-warning">Отправить</button>
    </form>
  </div>
</div>

{% endblock %}
