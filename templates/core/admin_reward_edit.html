{% extends 'core/base.html' %}
{% block title %}Редактирование награды{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-4">Редактирование награды</h2>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">{{ form.name.label }}</label>
        {{ form.name }}
      </div>
      <div class="mb-3">
        <label class="form-label">{{ form.description.label }}</label>
        {{ form.description }}
      </div>
      <div class="mb-3">
        <label class="form-label">{{ form.price.label }}</label>
        {{ form.price }}
      </div>
      <div class="mb-3">
        <label class="form-label">{{ form.category.label }}</label>
        {{ form.category }}
      </div>
      <div class="form-check mb-3">
        {{ form.is_active }}
        <label class="form-check-label">{{ form.is_active.label }}</label>
      </div>
      <button type="submit" class="btn btn-warning">Сохранить</button>
      <a href="{% url 'admin_rewards' %}" class="btn btn-outline-secondary">Назад</a>
    </form>
  </div>
</div>

{% endblock %}
